          PATCH_EOF
          git apply --whitespace=nowarn /tmp/ar.patch
          mkdir -p shared/ui/core/src/main/res/font
          for w in Regular Medium SemiBold Bold; do
            lw=$(echo $w | tr 'A-Z' 'a-z')
            curl -sfL -o shared/ui/core/src/main/res/font/ibmplexarabic_$lw.ttf "https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-arabic/fonts/complete/ttf/IBMPlexSansArabic-$w.ttf"
          done
          ls -l shared/ui/core/src/main/res/font | grep ibm
          sed -i 's/^version-name = ".*"/version-name = "0.1.43"/; s/^version-code = ".*"/version-code = "44"/' gradle/libs.versions.toml
          grep -n '^version-' gradle/libs.versions.toml
          git status --short
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > sign.jks
      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: walletify
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
  qa:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Prepare
        run: |
          cp apks/*x86_64*.apk new.apk
          ls -l apks
          cat > qa.sh <<'QA_EOF'
          #!/usr/bin/env bash
          set -u
          APK=new.apk; PKG=com.ctmhod.walletify; OUT=out; mkdir -p "$OUT"; U=scripts/ui.py
          adb logcat -c
          adb install -r "$APK" | tee "$OUT/install.txt"
          adb shell wm size 1080x2400; adb shell wm density 420
          n=0
          snap() { n=$((n+1)); adb exec-out screencap -p > "$OUT/$(printf %02d $n)-$1.png"; echo "[$n $1] $(python3 $U texts | cut -c1-500)" | tee -a "$OUT/screens.txt"; }
          launch() { adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1; sleep 9; }
          tapany() { for t in "$@"; do python3 $U tap-text "$t" >/dev/null 2>&1 && return 0; done; return 1; }
          # get through agreement + onboarding in either language
          onboard() {
            for k in $(seq 1 14); do
              T=$(python3 $U texts)
              case "$T" in *"Adjust your initial balance"*|*"اضبط رصيدك الابتدائي"*|*"No transactions"*|*"لا توجد معاملات"*) break;; esac
              tapany "Agree to all" "أوافق على الكل" "Offline account" "حساب بدون إنترنت" "Start fresh" "ابدأ من جديد" "Set" "تعيين" "Skip" "تخطّي" || sleep 3
              sleep 3
            done
            python3 $U tap-text prompt_dismiss >/dev/null 2>&1; sleep 2
          }
          openmenu() {
            python3 $U centers > /tmp/c0.txt
            set -- $(awk '($1>900 || $1<180) && $2<300 {print; exit}' /tmp/c0.txt)
            adb shell input tap $1 $2; sleep 3
          }
          # ---------- English fresh install, check nothing changed + language row
          adb shell cmd uimode night no
          adb shell pm clear $PKG >/dev/null
          launch; snap en-agreement
          tapany "Agree to all"; sleep 5
          onboard; snap en-home
          openmenu; snap en-menu
          tapany "Settings"; sleep 3; snap en-settings
          for i in 1 2; do adb shell input swipe 540 1700 540 900 300; sleep 1; done
          snap en-settings-scrolled
          python3 $U tap-text "Language" >/dev/null; sleep 2; snap en-language-dialog
          tapany "العربية"; sleep 5
          snap ar-after-switch
          adb shell am force-stop $PKG; launch; snap ar-relaunch-persisted
          python3 $U centers | head -30 > "$OUT/centers-ar-home.txt"
          openmenu; snap ar-menu
          tapany "الإعدادات"; sleep 3; snap ar-settings
          for i in 1 2; do adb shell input swipe 540 1700 540 900 300; sleep 1; done
          snap ar-settings-scrolled
          for i in 1 2 3; do adb shell input swipe 540 1700 540 600 300; sleep 1; done
          snap ar-settings-bottom
          # language back to system default and english
          for i in 1 2 3 4; do adb shell input swipe 540 700 540 1800 300; sleep 1; done
          tapany "اللغة"; sleep 2; snap ar-language-dialog
          tapany "English"; sleep 5; snap en-after-switch-back
          # ---------- Arabic via the system per-app language, fresh data (agreement in Arabic)
          adb shell cmd locale set-app-locales $PKG --locales ar >> "$OUT/locale.txt" 2>&1
          adb shell pm clear $PKG >/dev/null
          adb shell cmd locale set-app-locales $PKG --locales ar >> "$OUT/locale.txt" 2>&1
          launch; snap ar-agreement
          adb shell input swipe 540 1500 540 500 300; sleep 1; snap ar-agreement-scrolled
          adb shell cmd uimode night yes; sleep 2; snap ar-agreement-dark
          tapany "أوافق على الكل"; sleep 5; snap ar-onboarding-1
          onboard; snap ar-home-dark
          python3 $U centers > "$OUT/centers-ar-home2.txt"
          adb shell cmd uimode night no; sleep 2; snap ar-home-light
          openmenu; snap ar-menu-light
          adb logcat -d | grep -E "FATAL EXCEPTION" -A12 | head -40 > "$OUT/crash.txt"
          true
          QA_EOF
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-ar
          path: out
          retention-days: 3
