          +@Composable
          +private fun LanguageButton() {
          +    var show by remember { mutableStateOf(false) }
          +    val current = androidx.appcompat.app.AppCompatDelegate.getApplicationLocales()
          +    val currentTag = if (current.isEmpty()) "" else current[0]?.language.orEmpty()
          +    val systemDefault = stringResource(R.string.language_system_default)
          +    val options = listOf(
          +        "" to systemDefault,
          +        "en" to stringResource(R.string.language_english),
          +        "ar" to stringResource(R.string.language_arabic),
          +    )
          +    SettingsDefaultButton(
          +        icon = R.drawable.ic_vue_location_global,
          +        iconPadding = 6.dp,
          +        text = stringResource(R.string.language),
          +        description = options.firstOrNull { it.first == currentTag }?.second ?: systemDefault,
          +    ) {
          +        show = true
          +    }
          +    if (show) {
          +        androidx.compose.material3.AlertDialog(
          +            onDismissRequest = { show = false },
          +            title = { Text(stringResource(R.string.language)) },
          +            text = {
          +                Column {
          +                    options.forEach { (tag, label) ->
          +                        Row(
          +                            modifier = Modifier
          +                                .fillMaxWidth()
          +                                .clickable {
          +                                    show = false
          +                                    androidx.appcompat.app.AppCompatDelegate.setApplicationLocales(
          +                                        if (tag.isEmpty()) {
          +                                            androidx.core.os.LocaleListCompat.getEmptyLocaleList()
          +                                        } else {
          +                                            androidx.core.os.LocaleListCompat.forLanguageTags(
          +                                                if (tag == "ar") "ar-u-nu-latn" else tag
          +                                            )
          +                                        }
          +                                    )
          +                                }
          +                                .padding(vertical = 12.dp),
          +                            verticalAlignment = Alignment.CenterVertically,
          +                        ) {
          +                            androidx.compose.material3.RadioButton(
          +                                selected = tag == currentTag,
          +                                onClick = null,
          +                            )
          +                            Spacer(Modifier.width(12.dp))
          +                            Text(label)
          +                        }
          +                    }
          +                }
          +            },
          +            confirmButton = {
          +                androidx.compose.material3.TextButton(onClick = { show = false }) {
          +                    Text(stringResource(R.string.close))
          +                }
          +            },
          +        )
