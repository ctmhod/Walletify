          diff --git a/shared/ui/core/src/main/java/com/ivy/design/system/ArabicFont.kt b/shared/ui/core/src/main/java/com/ivy/design/system/ArabicFont.kt
          new file mode 100644
          index 0000000..30474c4
          --- /dev/null
          +++ b/shared/ui/core/src/main/java/com/ivy/design/system/ArabicFont.kt
          @@ -0,0 +1,48 @@
          +package com.ivy.design.system
          +
          +import androidx.compose.material3.Typography
          +import androidx.compose.ui.text.font.Font
          +import androidx.compose.ui.text.font.FontFamily
          +import androidx.compose.ui.text.font.FontWeight
          +import com.ivy.ui.R
          +import java.util.Locale
          +
          +/**
          + * IBM Plex Sans Arabic (SIL OFL): a clean, modern Arabic face close in feel to the
          + * system Arabic font on iPhone. Only used when the app language is Arabic.
          + */
          +object ArabicFont {
          +    fun isArabic(): Boolean = Locale.getDefault().language == "ar"
          +
          +    val family = FontFamily(
          +        Font(R.font.ibmplexarabic_regular, FontWeight.Normal),
          +        Font(R.font.ibmplexarabic_regular, FontWeight.Light),
          +        Font(R.font.ibmplexarabic_medium, FontWeight.Medium),
          +        Font(R.font.ibmplexarabic_semibold, FontWeight.SemiBold),
          +        Font(R.font.ibmplexarabic_bold, FontWeight.Bold),
          +        Font(R.font.ibmplexarabic_bold, FontWeight.ExtraBold),
          +        Font(R.font.ibmplexarabic_bold, FontWeight.Black),
          +    )
          +
          +    fun materialTypography(): Typography {
          +        val t = Typography()
          +        val f = family
          +        return Typography(
          +            displayLarge = t.displayLarge.copy(fontFamily = f),
          +            displayMedium = t.displayMedium.copy(fontFamily = f),
          +            displaySmall = t.displaySmall.copy(fontFamily = f),
          +            headlineLarge = t.headlineLarge.copy(fontFamily = f),
          +            headlineMedium = t.headlineMedium.copy(fontFamily = f),
          +            headlineSmall = t.headlineSmall.copy(fontFamily = f),
          +            titleLarge = t.titleLarge.copy(fontFamily = f),
          +            titleMedium = t.titleMedium.copy(fontFamily = f),
          +            titleSmall = t.titleSmall.copy(fontFamily = f),
          +            bodyLarge = t.bodyLarge.copy(fontFamily = f),
          +            bodyMedium = t.bodyMedium.copy(fontFamily = f),
          +            bodySmall = t.bodySmall.copy(fontFamily = f),
          +            labelLarge = t.labelLarge.copy(fontFamily = f),
          +            labelMedium = t.labelMedium.copy(fontFamily = f),
          +            labelSmall = t.labelSmall.copy(fontFamily = f),
          +        )
          +    }
          +}
