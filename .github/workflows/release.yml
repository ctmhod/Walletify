name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > sign.jks
      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: walletify
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Package and verify
        run: |
          VER=$(grep '^version-name' gradle/libs.versions.toml | cut -d'"' -f2)
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk)
            abi=${n#app-}; abi=${abi%-release}
            if [ "$abi" = "universal" ]; then dest="Walletify-v$VER-all-universal.apk"; else dest="Walletify-v$VER-$abi.apk"; fi
            cp "$f" "out/$dest"
          done
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do
            echo "== $f ($(stat -c%s "$f") bytes)"
            $APKSIGNER verify --print-certs "$f" | grep -E "SHA-256|Verifies"
            $AAPT dump badging "$f" | grep -E "^package|sdkVersion|native-code"
          done
          echo "VER=$VER" >> $GITHUB_ENV
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME:-v$VER}
          cat > notes.md <<NOTES
          Walletify v$VER, an offline money manager for Android.

          New in v$VER: Launcher icon fits inside the adaptive-icon safe zone, so the W is no longer clipped on phones.

          Requires Android 10 (API 29) or newer.

          Start with **Walletify-v$VER-all-universal.apk** (works on every device).
          Smaller per-CPU builds: arm64-v8a (most phones and tablets), armeabi-v7a (older 32-bit devices), x86 and x86_64 (emulators).
          If the install fails with "App not installed", uninstall any older Walletify build first (signing key may differ).
          NOTES
          gh release create "$TAG" \
            "out/Walletify-v$VER-all-universal.apk" \
            "out/Walletify-v$VER-arm64-v8a.apk" \
            "out/Walletify-v$VER-armeabi-v7a.apk" \
            "out/Walletify-v$VER-x86.apk" \
            "out/Walletify-v$VER-x86_64.apk" \
            --title "Walletify $TAG" --notes-file notes.md
