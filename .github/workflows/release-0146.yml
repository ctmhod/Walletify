name: Release v0.1.46
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Short month in the date pill, bump version
        run: |
          cat > name.b64 <<'B64_EOF'
          ZGlmZiAtLWdpdCBhL3RlbXAvbGVnYWN5LWNvZGUvc3JjL21haW4vamF2YS9jb20vaXZ5L2xlZ2FjeS9kYXRhL21vZGVsL1RpbWVQ
          ZXJpb2Qua3QgYi90ZW1wL2xlZ2FjeS1jb2RlL3NyYy9tYWluL2phdmEvY29tL2l2eS9sZWdhY3kvZGF0YS9tb2RlbC9UaW1lUGVy
          aW9kLmt0CmluZGV4IGUzMjhhNWYuLmJiYjAxMTggMTAwNjQ0Ci0tLSBhL3RlbXAvbGVnYWN5LWNvZGUvc3JjL21haW4vamF2YS9j
          b20vaXZ5L2xlZ2FjeS9kYXRhL21vZGVsL1RpbWVQZXJpb2Qua3QKKysrIGIvdGVtcC9sZWdhY3ktY29kZS9zcmMvbWFpbi9qYXZh
          L2NvbS9pdnkvbGVnYWN5L2RhdGEvbW9kZWwvVGltZVBlcmlvZC5rdApAQCAtMTQ1LDcgKzE0NSw3IEBAIGRhdGEgY2xhc3MgVGlt
          ZVBlcmlvZCgKICAgICAgICAgd2hlbiB7CiAgICAgICAgICAgICBtb250aCAhPSBudWxsIC0+IHsKICAgICAgICAgICAgICAgICBp
          ZiAoc3RhcnREYXRlT2ZNb250aCA9PSAxKSB7Ci0gICAgICAgICAgICAgICAgICAgIGRpc3BsYXlNb250aFN0YXJ0aW5nT24xc3Qo
          bW9udGggPSBtb250aCwgdGltZVByb3ZpZGVyKQorICAgICAgICAgICAgICAgICAgICBkaXNwbGF5TW9udGhTdGFydGluZ09uMXN0
          KG1vbnRoID0gbW9udGgsIHRpbWVQcm92aWRlciwgYWJicmV2aWF0ZSA9IHRydWUpCiAgICAgICAgICAgICAgICAgfSBlbHNlIHsK
          ICAgICAgICAgICAgICAgICAgICAgdmFsIHJhbmdlID0gdG9SYW5nZSgKICAgICAgICAgICAgICAgICAgICAgICAgIHN0YXJ0RGF0
          ZU9mTW9udGggPSBzdGFydERhdGVPZk1vbnRoLApAQCAtMjEzLDYgKzIxMyw3IEBAIGRhdGEgY2xhc3MgVGltZVBlcmlvZCgKICAg
          ICBwcml2YXRlIGZ1biBkaXNwbGF5TW9udGhTdGFydGluZ09uMXN0KAogICAgICAgICBtb250aDogTW9udGgsCiAgICAgICAgIHRp
          bWVQcm92aWRlcjogVGltZVByb3ZpZGVyLAorICAgICAgICBhYmJyZXZpYXRlOiBCb29sZWFuID0gZmFsc2UsCiAgICAgKTogU3Ry
          aW5nIHsKICAgICAgICAgdmFsIHllYXIgPSB5ZWFyCiAgICAgICAgIHJldHVybiBpZiAoeWVhciAhPSBudWxsICYmIHRpbWVQcm92
          aWRlci5sb2NhbE5vdygpLnllYXIgIT0geWVhcikgewpAQCAtMjIwLDcgKzIyMSw3IEBAIGRhdGEgY2xhc3MgVGltZVBlcmlvZCgK
          ICAgICAgICAgICAgICIke21vbnRoLm5hbWUuc3Vic3RyaW5nKDAsIE1vbnRoTmFtZUFiYnJldmlhdGlvbkxlbmd0aCl9LCAkeWVh
          ciIKICAgICAgICAgfSBlbHNlIHsKICAgICAgICAgICAgIC8vIHRoaXMgeWVhcgotICAgICAgICAgICAgbW9udGgubmFtZQorICAg
          ICAgICAgICAgaWYgKGFiYnJldmlhdGUpIG1vbnRoLm5hbWUuc3Vic3RyaW5nKDAsIE1vbnRoTmFtZUFiYnJldmlhdGlvbkxlbmd0
          aCkgZWxzZSBtb250aC5uYW1lCiAgICAgICAgIH0KICAgICB9CiB9Cg==
          B64_EOF
          base64 -d name.b64 > name.diff
          rm name.b64
          git apply --index name.diff
          rm name.diff
          sed -i 's/^version-name = ".*"/version-name = "0.1.46"/; s/^version-code = ".*"/version-code = "47"/' gradle/libs.versions.toml
          grep -n '^version-' gradle/libs.versions.toml
          git diff --cached --stat
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > sign.jks
      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: walletify
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Package and verify
        run: |
          VER=0.1.46
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk)
            abi=${n#app-}; abi=${abi%-release}
            if [ "$abi" = "universal" ]; then dest="Walletify-v$VER-0-universal.apk"; else dest="Walletify-v$VER-$abi.apk"; fi
            cp "$f" "out/$dest"
          done
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do
            echo "== $f ($(stat -c%s "$f") bytes)"
            $APKSIGNER verify --print-certs "$f" | grep -E "SHA-256|Verifies"
            $AAPT dump badging "$f" | grep -E "^package|sdkVersion|native-code"
          done
      - name: Commit and push source change
        run: |
          rm -f sign.jks
          git add -A feature gradle app temp
          git -c user.name="ctmhod" -c user.email="290202009+ctmhod@users.noreply.github.com" commit -q -m "Short month name in the date pill (v0.1.46)"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=0.1.46
          cat > notes.md <<NOTES
          Walletify v$VER, an offline money manager for Android.

          Change: the date pill at the top of Home shows a short month (Nov), so the greeting name has more room.

          Requires Android 10 (API 29) or newer.

          Start with **Walletify-v$VER-0-universal.apk** (works on every device).
          Smaller per-architecture files: arm64-v8a (most phones and tablets), armeabi-v7a (older 32-bit devices), x86_64 (emulators).
          If the install fails with "App not installed", uninstall any older Walletify build first (signing key may differ).
          NOTES
          sed -i 's/^ *//' notes.md
          gh release create "v$VER" out/*.apk --target main --title "Walletify v$VER" --notes-file notes.md
