name: Release v0.1.43
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove per-app language entry and bump version
        run: |
          python3 - <<'PY_EOF'
          p='app/build.gradle.kts'
          t=open(p,encoding='utf-8').read()
          blk='    androidResources {\n        generateLocaleConfig = true\n    }\n\n'
          assert t.count(blk)==1
          open(p,'w',encoding='utf-8').write(t.replace(blk,''))
          PY_EOF
          python3 - <<'PY2_EOF'
          p='feature/settings/src/main/java/com/ivy/settings/SettingsViewModel.kt'
          t=open(p,encoding='utf-8').read()
          old='return Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU'
          assert t.count(old)==1
          open(p,'w',encoding='utf-8').write(t.replace(old,'return false'))
          PY2_EOF
          sed -i 's/^version-name = ".*"/version-name = "0.1.43"/; s/^version-code = ".*"/version-code = "44"/' gradle/libs.versions.toml
          grep -n '^version-' gradle/libs.versions.toml
          git diff --stat
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > sign.jks
      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: walletify
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Package and verify
        run: |
          VER=0.1.43
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk)
            abi=${n#app-}; abi=${abi%-release}
            if [ "$abi" = "universal" ]; then dest="Walletify-v$VER-0-universal.apk"; else dest="Walletify-v$VER-$abi.apk"; fi
            cp "$f" "out/$dest"
          done
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do
            echo "== $f ($(stat -c%s "$f") bytes)"
            $APKSIGNER verify --print-certs "$f" | grep -E "SHA-256|Verifies"
            $AAPT dump badging "$f" | grep -E "^package|sdkVersion|native-code"
          done
      - name: Commit and push source change
        run: |
          rm -f sign.jks
          git add -A feature gradle app temp
          git -c user.name="ctmhod" -c user.email="290202009+ctmhod@users.noreply.github.com" commit -q -m "Remove the language button and per-app language entry (v0.1.43)"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=0.1.43
          cat > notes.md <<NOTES
          Walletify v$VER, an offline money manager for Android.

          Change: Walletify is English only. The Language button in Settings and the "App language" entry in Android settings are gone.

          Requires Android 10 (API 29) or newer.

          Start with **Walletify-v$VER-0-universal.apk** (works on every device).
          Smaller per-architecture files: arm64-v8a (most phones and tablets), armeabi-v7a (older 32-bit devices), x86_64 (emulators).
          If the install fails with "App not installed", uninstall any older Walletify build first (signing key may differ).
          NOTES
          sed -i 's/^ *//' notes.md
          gh release create "v$VER" out/*.apk --target main --title "Walletify v$VER" --notes-file notes.md
