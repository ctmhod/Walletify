name: QA v0.1.50
on:
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.50 -p '*x86_64.apk' -O new.apk
          gh release download v0.1.49 -p '*x86_64.apk' -O old.apk
          ls -l new.apk old.apk
          cat > qa.sh <<'QA_EOF'
          #!/usr/bin/env bash
          set -u
          APK=new.apk; OLD=old.apk; PKG=com.ctmhod.walletify; OUT=out; mkdir -p "$OUT"; U=scripts/ui.py
          adb logcat -c
          adb shell wm size 720x1560; adb shell wm density 320
          n=0
          snap() { n=$((n+1)); adb exec-out screencap -p > "$OUT/$(printf %02d $n)-$1.png"; echo "[$n $1] $(python3 $U texts | cut -c1-400)" | tee -a "$OUT/screens.txt"; }
          launch() { adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1; sleep 10; }
          agree() { for j in 1 2; do adb shell input swipe 360 1300 360 400 300; sleep 1; done; python3 $U tap-bottom; sleep 5; }
          finish_onboarding() { for k in $(seq 1 12); do
            T=$(python3 $U texts)
            case "$T" in *"Adjust your initial balance"*|*"No transactions"*) break;; esac
            case "$T" in
              *"Start fresh"*) python3 $U tap-text "Start fresh"; sleep 3;;
              *"Set currency"*) python3 $U tap-text "Set"; sleep 3;;
              *"Add accounts"*|*"Add categories"*) python3 $U tap-text "Skip"; sleep 3;;
              *) sleep 3;;
            esac
          done; }
          inst() { adb shell am force-stop $PKG; sleep 2; adb uninstall $PKG >/dev/null 2>&1; sleep 3; adb install -r "$1" >/dev/null; }
          # 1. fresh install of the new version
          inst "$APK"; launch; snap "fresh-first-launch"
          python3 $U tap-text "Offline account"; sleep 4; snap "fresh-next-screen"
          # 2. upgrade from v0.1.49 after finishing setup (agreement was accepted)
          inst "$OLD"; launch; agree; python3 $U tap-text "Offline account"; sleep 4
          adb shell input text Mahmoud; sleep 1; python3 $U tap-text "Next"; sleep 3
          finish_onboarding; python3 $U tap-text prompt_dismiss; sleep 2; snap "upgrade-A-old-home"
          adb shell am force-stop $PKG; adb install -r "$APK" >/dev/null; launch; snap "upgrade-A-new-home"
          # 3. upgrade from v0.1.49 that never accepted the agreement
          inst "$OLD"; launch; snap "upgrade-B-old-agreement"
          adb shell am force-stop $PKG; adb install -r "$APK" >/dev/null; launch; snap "upgrade-B-new-first-launch"
          adb logcat -d | grep -E "FATAL EXCEPTION" -A10 | head -30 > "$OUT/crash.txt"
          true

          QA_EOF
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-0150
          path: out
          retention-days: 3
