name: Launcher icon screenshot
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to screenshot
        required: true
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -p '*-x86_64.apk' -O app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Home screen shot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/iconshot.sh app.apk out
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-shot
          path: out
