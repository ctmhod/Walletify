name: QA updater fix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        default: v0.1.58
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -p '*x86_64.apk' -O app.apk
          LATEST=$(gh release view --json tagName --jq .tagName)
          echo "LATEST_TAG=$LATEST" >> "$GITHUB_ENV"
      - name: Install emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: QA updater fix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Throttle to ~250 KB/s so the kill-mid-download and single-flight
          # steps can actually observe an in-progress download.
          emulator-options: -no-snapshot-save -netspeed 2000:2000
          script: bash scripts/updatefix.sh app.apk out "$LATEST_TAG"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-updatefix-api${{ matrix.api }}
          path: out
