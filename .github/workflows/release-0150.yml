name: Release v0.1.50
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Same-size Home header row, bump version
        run: |
          cat > name.b64 <<'B64_EOF'
          ZGlmZiAtLWdpdCBhL2FwcC9zcmMvbWFpbi9qYXZhL2NvbS9pdnkvd2FsbGV0L1Jvb3RWaWV3TW9k
          ZWwua3QgYi9hcHAvc3JjL21haW4vamF2YS9jb20vaXZ5L3dhbGxldC9Sb290Vmlld01vZGVsLmt0
          CmluZGV4IGIyOTBkMWUuLmI2MjE4NzMgMTAwNjQ0Ci0tLSBhL2FwcC9zcmMvbWFpbi9qYXZhL2Nv
          bS9pdnkvd2FsbGV0L1Jvb3RWaWV3TW9kZWwua3QKKysrIGIvYXBwL3NyYy9tYWluL2phdmEvY29t
          L2l2eS93YWxsZXQvUm9vdFZpZXdNb2RlbC5rdApAQCAtMTQsNyArMTQsNiBAQCBpbXBvcnQgY29t
          Lml2eS5mcnAudGVzdC5UZXN0SWRsaW5nUmVzb3VyY2UKIGltcG9ydCBjb20uaXZ5LmxlZ2FjeS5J
          dnlXYWxsZXRDdHgKIGltcG9ydCBjb20uaXZ5LmxlZ2FjeS51dGlscy5pb1RocmVhZAogaW1wb3J0
          IGNvbS5pdnkubGVnYWN5LnV0aWxzLnJlYWRPbmx5Ci1pbXBvcnQgY29tLml2eS5uYXZpZ2F0aW9u
          LkRpc2NsYWltZXJTY3JlZW4KIGltcG9ydCBjb20uaXZ5Lm5hdmlnYXRpb24uRWRpdFRyYW5zYWN0
          aW9uU2NyZWVuCiBpbXBvcnQgY29tLml2eS5uYXZpZ2F0aW9uLk1haW5TY3JlZW4KIGltcG9ydCBj
          b20uaXZ5Lm5hdmlnYXRpb24uTmF2aWdhdGlvbgpAQCAtODQsOSArODMsNiBAQCBjbGFzcyBSb290
          Vmlld01vZGVsIEBJbmplY3QgY29uc3RydWN0b3IoCiAgICAgICAgICAgICAgICAgfSBlbHNlIHsK
          ICAgICAgICAgICAgICAgICAgICAgbmF2Lm5hdmlnYXRlVG8oT25ib2FyZGluZ1NjcmVlbikKICAg
          ICAgICAgICAgICAgICB9Ci0gICAgICAgICAgICAgICAgaWYgKCFsZWdhbFJlcG8uaXNEaXNjbGFp
          bWVyQWNjZXB0ZWQoKSkgewotICAgICAgICAgICAgICAgICAgICBuYXYubmF2aWdhdGVUbyhEaXNj
          bGFpbWVyU2NyZWVuKQotICAgICAgICAgICAgICAgIH0KICAgICAgICAgICAgIH0KIAogICAgICAg
          ICAgICAgVGVzdElkbGluZ1Jlc291cmNlLmRlY3JlbWVudCgpCg==
          B64_EOF
          base64 -d name.b64 > name.diff
          rm name.b64
          git apply --index name.diff
          rm name.diff
          sed -i 's/^version-name = ".*"/version-name = "0.1.50"/; s/^version-code = ".*"/version-code = "51"/' gradle/libs.versions.toml
          grep -n '^version-' gradle/libs.versions.toml
          git diff --cached --stat
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > sign.jks
      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: walletify
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Package and verify
        run: |
          VER=0.1.50
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk)
            abi=${n#app-}; abi=${abi%-release}
            if [ "$abi" = "universal" ]; then dest="Walletify-v$VER-0-universal.apk"; else dest="Walletify-v$VER-$abi.apk"; fi
            cp "$f" "out/$dest"
          done
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do
            echo "== $f ($(stat -c%s "$f") bytes)"
            $APKSIGNER verify --print-certs "$f" | grep -E "SHA-256|Verifies"
            $AAPT dump badging "$f" | grep -E "^package|sdkVersion|native-code"
          done
      - name: Commit and push source change
        run: |
          rm -f sign.jks
          git add -A feature gradle app temp
          git -c user.name="ctmhod" -c user.email="290202009+ctmhod@users.noreply.github.com" commit -q -m "Remove the Important User Agreement screen (v0.1.50)"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=0.1.50
          cat > notes.md <<NOTES
          Walletify v$VER, an offline money manager for Android.

          Change: the "Important User Agreement" screen is gone. The app opens straight to the next screen. Nothing else changed.

          Requires Android 10 (API 29) or newer.

          Start with **Walletify-v$VER-0-universal.apk** (works on every device).
          Smaller per-architecture files: arm64-v8a (most phones and tablets), armeabi-v7a (older 32-bit devices), x86_64 (emulators).
          If the install fails with "App not installed", uninstall any older Walletify build first (signing key may differ).
          NOTES
          sed -i 's/^ *//' notes.md
          gh release create "v$VER" out/*.apk --target main --title "Walletify v$VER" --notes-file notes.md
