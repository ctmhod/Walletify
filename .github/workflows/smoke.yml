name: Smoke test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
      script:
        description: Script in scripts/
        default: smoke.sh
      apk:
        description: APK name pattern
        default: '*x86_64.apk'
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34]
    steps:
      - uses: actions/checkout@v4
      - name: Download x86_64 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -p '${{ inputs.apk }}' -O app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: ./scripts/${{ inputs.script }} app.apk out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: out
